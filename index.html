<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرار از ام‌عباس! - بازی تعقیب و گریز</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #2b2318;
            font-family: Tahoma, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #ffebcd;
            background: rgba(40, 30, 20, 0.8);
            padding: 12px;
            border-radius: 8px;
            pointer-events: none;
            border: 1px solid #654321;
            font-size: 16px;
        }
        #message-box {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4500;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            display: none;
            pointer-events: none;
            text-align: center;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 5px;
        }
        .btn {
            background: rgba(101, 67, 33, 0.7);
            border: 2px solid #8b5a2b;
            color: white;
            height: 60px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn:active {
            background: rgba(74, 48, 24, 0.9);
        }
    </style>
</head>
<body>

    <div id="ui">
        وضعیت: <span id="status">فرار کنید! ام‌عباس دنبال شماست...</span><br>
        تعداد ماچ‌ها: <span id="kiss-count">0</span>
    </div>

    <div id="message-box">😘 ام‌عباس گرفتت و ماچت کرد! موچ موچ! 😘</div>

    <div class="controls">
        <div></div>
        <button class="btn" onclick="move('forward')">⬆️</button>
        <div></div>
        <button class="btn" onclick="move('left')">⬅️</button>
        <button class="btn" onclick="move('backward')">⬇️</button>
        <button class="btn" onclick="move('right')">➡️</button>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let umAbbas;
        let kissCount = 0;
        let myPos = { x: 0, z: 5 };
        let umAbbasPos = { x: 0, z: -15 };
        let isCaught = false;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x3a3328);
            scene.fog = new THREE.FogExp2(0x3a3328, 0.03);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(myPos.x, 3, myPos.z);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // نورپردازی
            const light = new THREE.DirectionalLight(0xd4af37, 0.8);
            light.position.set(20, 30, 20);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x554433, 0.6));

            // زمین خاکی
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(100, 100),
                new THREE.MeshStandardMaterial({ color: 0x4a3b2c, roughness: 0.9 })
            );
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // ساخت مدل ام‌عباس (پیرزن با چادر یا لباس سنتی)
            const group = new THREE.Group();
            
            // بدن پیرزن
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x554433 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2, 1), bodyMat);
            body.position.y = 1;
            group.add(body);

            // سر پیرزن
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), headMat);
            head.position.y = 2.3;
            group.add(head);

            umAbbas = group;
            umAbbas.position.set(umAbbasPos.x, 0, umAbbasPos.z);
            scene.add(umAbbas);

            animate();
        }

        function move(dir) {
            if (isCaught) return;

            if (dir === 'left') myPos.x -= 1.5;
            if (dir === 'right') myPos.x += 1.5;
            if (dir === 'forward') myPos.z -= 1.5;
            if (dir === 'backward') myPos.z += 1.5;

            camera.position.x = myPos.x;
            camera.position.z = myPos.z;
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!isCaught) {
                // هوش مصنوعی تعقیب‌کننده ام‌عباس (حرکت به سمت بازیکن)
                const dx = myPos.x - umAbbasPos.x;
                const dz = myPos.z - umAbbasPos.z;
                const dist = Math.sqrt(dx * dx + dz * dz);

                if (dist > 1) {
                    // سرعت دنبال کردن ام‌عباس
                    umAbbasPos.x += (dx / dist) * 0.04;
                    umAbbasPos.z += (dz / dist) * 0.04;
                    umAbbas.position.set(umAbbasPos.x, 0, umAbbasPos.z);
                    umAbbas.lookAt(camera.position.x, umAbbas.position.y, camera.position.z);
                } else {
                    // وقتی ام‌عباس به شما می‌رسد و ماچتان می‌کند!
                    isCaught = true;
                    kissCount++;
                    document.getElementById('kiss-count').innerText = kissCount;
                    document.getElementById('message-box').style.display = 'block';
                    document.getElementById('status').innerText = 'ام‌عباس به شما رسید!';

                    // بعد از ۲ ثانیه ام‌عباس عقبنشینی می‌کند تا دوباره فرار کنید
                    setTimeout(() => {
                        isCaught = false;
                        document.getElementById('message-box').style.display = 'none';
                        document.getElementById('status').innerText = 'فرار کنید! ام‌عباس دوباره دنبالتان کرد...';
                        umAbbasPos.z -= 15; // دور شدن ام‌عباس
                    }, 2500);
                }
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
