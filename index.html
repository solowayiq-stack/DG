<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی اسنایپر ۴ نفره آنلاین - پابجی سبک وب</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: Tahoma, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #menu {
            position: absolute;
            top: 50%<b>left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 25px;
            border-radius: 12px;
            color: white;
            text-align: center;
            border: 2px solid #ff4500;
            z-index: 10;
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.5);
        }
        input, button {
            padding: 12px;
            font-size: 16px;
            margin: 8px;
            border-radius: 6px;
            border: none;
        }
        button {
            background: #ff4500;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:active {
            background: #e03d00;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px;
            border-radius: 8px;
            display: none;
            pointer-events: none;
        }
        /* دوربین اسنایپر */
        #scope {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border: 4px solid #222;
            border-radius: 50%;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.9);
            display: none;
            pointer-events: none;
        }
        #scope::before, #scope::after {
            content: '';
            position: absolute;
            background: red;
        }
        #scope::before { top: 50%; left: 0; width: 100%; height: 2px; transform: translateY(-50%); }
        #scope::after { top: 0; left: 50%; width: 2px; height: 100%; transform: translateX(-50%); }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: grid;
            grid-template-columns: repeat(3, 55px);
            gap: 5px;
            display: none;
        }
        .btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            height: 55px;
            font-size: 18px;
            border-radius: 8px;
        }
        #zoom-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- منوی ورود و ساخت اتاق -->
    <div id="menu">
        <h2>بازی اسنایپر ۴ نفره آنلاین</h2>
        <p>کد اتصال خود را به دوستانتان بدهید یا به اتاق آن‌ها متصل شوید.</p>
        <button onclick="hostGame()">ساخت اتاق جدید (میزبان)</button><br><br>
        <input type="text" id="host-id-input" placeholder="کد میزبان را اینجا وارد کنید"><br>
        <button onclick="joinGame()">ورود به اتاق دوست</button>
        <p id="my-id-display" style="color: #00ffcc; margin-top: 15px;"></p>
    </div>

    <div id="ui">
        بازیکنان متصل: <span id="player-count">1</span> / 4<br>
        وضعیت: <span id="status">در انتظار بقیه بازیکنان...</span>
    </div>

    <div id="scope"></div>

    <div class="controls" id="touch-controls">
        <div></div>
        <button class="btn" onclick="move('forward')">⬆️</button>
        <div></div>
        <button class="btn" onclick="move('left')">⬅️</button>
        <button class="btn" onclick="move('backward')">⬇️</button>
        <button class="btn" onclick="move('right')">➡️</button>
    </div>

    <button id="zoom-btn" class="btn" onclick="toggleScope()">زوم اسنایپر 🎯</button>

    <div id="canvas-container"></div>

    <!-- کتابخانه‌های Three.js و PeerJS برای ارتباط آنلاین P2P -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script>
        let peer, conn;
        let isHost = false;
        let connections = [];
        let scene, camera, renderer;
        let playerSpheres = {};
        let isScopeActive = false;
        let myPos = { x: 0, z: 0 };

        function initGameUI() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('ui').style.display = 'block';
            document.getElementById('touch-controls').style.display = 'grid';
            document.getElementById('zoom-btn').style.display = 'block';
            init3D();
        }

        // ساخت اتاق توسط میزبان
        function hostGame() {
            peer = new Peer();
            peer.on('open', (id) => {
                isHost = true;
                document.getElementById('my-id-display').innerText = "کد شما (به دوستان بدهید): " + id;
            });

            peer.on('connection', (incomingConn) => {
                if (connections.length < 3) {
                    connections.push(incomingConn);
                    document.getElementById('player-count').innerText = connections.length + 1;
                    
                    incomingConn.on('data', (data) => {
                        updateRemotePlayer(incomingConn.peer, data);
                        // ارسال داده‌ها به بقیه بازیکنان
                        connections.forEach(c => { if(c.peer !== incomingConn.peer) c.send(data); });
                    });
                }
            });
            initGameUI();
        }

        // ورود به اتاق میزبان
        function joinGame() {
            const hostId = document.getElementById('host-id-input').value.trim();
            if (!hostId) return alert('لطفاً کد میزبان را وارد کنید!');

            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(hostId);
                conn.on('open', () => {
                    initGameUI();
                    document.getElementById('status').innerText = "متصل شدید! آماده نبرد.";
                });
                conn.on('data', (data) => {
                    updateRemotePlayer(data.id, data);
                });
            });
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(10, 20, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));

            // زمین جنگی
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(100, 100),
                new THREE.MeshStandardMaterial({ color: 0x1c2826, roughness: 0.9 })
            );
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            animate();
        }

        function move(dir) {
            if (dir === 'left') myPos.x -= 1;
            if (dir === 'right') myPos.x += 1;
            if (dir === 'forward') myPos.z -= 1;
            if (dir === 'backward') myPos.z += 1;

            camera.position.x = myPos.x;
            camera.position.z = myPos.z + 5;

            // ارسال موقعیت جدید به دیگران
            const myData = { id: peer.id, x: myPos.x, z: myPos.z };
            if (isHost) {
                connections.forEach(c => c.send(myData));
            } else if (conn && conn.open) {
                conn.send(myData);
            }
        }

        function updateRemotePlayer(id, data) {
            if (!playerSpheres[id]) {
                const mat = new THREE.MeshStandardMaterial({ color: 0xff4500 });
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), mat);
                scene.add(mesh);
                playerSpheres[id] = mesh;
            }
            playerSpheres[id].position.set(data.x, 1, data.z);
        }

        function toggleScope() {
            isScopeActive = !isScopeActive;
            document.getElementById('scope').style.display = isScopeActive ? 'block' : 'none';
            camera.fov = isScopeActive ? 15 : 75;
            camera.updateProjectionMatrix();
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
